[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "songguard"
version = "0.1.0"
description = "Song lyric copyright-infringement screener: screens candidate/LLM-generated lyrics against a reference catalog using shingle containment, Jaccard similarity, and longest-common-phrase ('sampling') detection. Zero dependencies, offline, no LLM."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.hatch.build.targets.wheel]
packages = ["src/songguard"]