[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plugattest"
version = "1.0.0"
description = "Capability attestation for plugin/skill packages -- compares what a package's manifest declares against what its own code actually does, and fails closed on undeclared use. Offline, zero external dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Forge (Jarmes system)" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
plugattest = "plugattest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/plugattest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
