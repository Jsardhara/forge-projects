[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firmwareguard"
version = "0.1.0"
description = "Firmware vulnerability tracker and fleet compliance tool"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Forge", email = "forge@jarmes.local" }]
dependencies = []

[project.scripts]
firmwareguard = "firmwareguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/firmwareguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
