[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "npm-shield"
version = "0.1.0"
description = "Audit npm dependencies for install scripts and generate v12-compliant allowlists"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
npm-shield = "npm_shield.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/npm_shield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
