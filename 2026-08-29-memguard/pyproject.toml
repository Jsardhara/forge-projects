[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memguard"
version = "0.1.0"
description = "Static scanner for AI-agent memory poisoning & prompt-injection over memory/prompt files. Zero deps, no LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.hatch.build.targets.wheel]
packages = ["src/memguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]