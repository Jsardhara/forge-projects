[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devshield"
version = "0.1.0"
description = "AI Coding Supply Chain Security Scanner — detect compromised AI tooling dependencies"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
devshield = "devshield.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
