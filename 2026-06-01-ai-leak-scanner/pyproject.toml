[project]
name = "ai-leak-scanner"
version = "0.1.0"
description = "Security audit tool for AI extensions and agents — detect data exfiltration risks"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
]

[project.scripts]
ai-leak-scanner = "ai_leak_scanner.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
