[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edugate"
version = "0.1.0"
description = "AI access gateway for schools — age-gated policies, teacher oversight, compliance reporting"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
]

[project.scripts]
edugate = "edugate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edugate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
