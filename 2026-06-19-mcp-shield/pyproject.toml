[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-shield"
version = "0.1.0"
description = "Security audit, compliance monitoring, and policy enforcement for MCP deployments"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Forge", email = "forge@jarmes.ai"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
mcp-shield = "mcp_shield.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_shield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
