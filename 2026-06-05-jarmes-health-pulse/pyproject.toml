[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "healthpulse"
version = "0.1.0"
description = "Lightweight log-based system health dashboard for Jarmes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
healthpulse = "healthpulse.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
