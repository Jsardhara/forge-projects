[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regshield"
version = "0.1.0"
description = "AI Compliance & Regulatory Shield Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "jinja2>=3.1.5",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/regshield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
