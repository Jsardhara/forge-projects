[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-royale"
version = "0.1.0"
description = "Competitive AI agent benchmarking platform — arena battles, tournaments, leaderboards"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
agent-royale = "agent_royale.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_royale"]

[tool.pytest.ini_options]
testpaths = ["tests"]
