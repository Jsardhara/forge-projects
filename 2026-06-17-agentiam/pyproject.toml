[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentiam"
version = "0.1.0"
description = "AI Agent Identity & Access Management — identity lifecycle, credential management, and access control for autonomous agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
agentiam = "agentiam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentiam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
