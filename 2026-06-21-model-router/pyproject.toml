[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-router"
version = "0.1.0"
description = "GLM-5.2 OpenAI-compatible gateway with fallback, health checks, and cost tracking"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
model-router = "model_router.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/model_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
