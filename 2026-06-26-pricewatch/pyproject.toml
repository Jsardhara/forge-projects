[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pricewatch"
version = "0.1.0"
description = "LLM Provider Price Intelligence Monitor — track, compare, alert on API pricing changes across OpenAI, Anthropic, Google, Mistral"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.scripts]
pricewatch = "pricewatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pricewatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
