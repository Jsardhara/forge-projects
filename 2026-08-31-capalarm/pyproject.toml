[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capalarm"
version = "0.1.0"
description = "Subscription AI plan-cap compliance: token/rate cap consumption, headroom, and days-to-breach forecasting."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.hatch.build.targets.wheel]
packages = ["src/capalarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]