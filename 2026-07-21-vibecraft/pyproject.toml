[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibecraft"
version = "0.1.0"
description = "AI-Assisted Code Craftsmanship Auditor — detect vibe-coding patterns, measure quality, CI gate"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
vibecraft = "vibecraft.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vibecraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
