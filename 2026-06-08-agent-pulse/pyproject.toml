[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-pulse"
version = "0.1.0"
description = "Multi-Agent Activity Dashboard for Jarmes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
