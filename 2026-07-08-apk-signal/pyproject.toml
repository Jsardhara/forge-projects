[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apk-signal"
version = "0.1.0"
description = "Static triage signal extractor for Android APKs (permissions, C2 URLs, hardcoded secrets, suspicious capabilities) — zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Jarmes Team", email = "dev@jarmes.io"}]
classifiers = ["Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://github.com/Jsardhara/forge-projects"

[project.scripts]
apk-signal = "apk_signal.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apk_signal"]
