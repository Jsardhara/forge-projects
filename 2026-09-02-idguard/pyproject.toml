[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idguard"
version = "0.1.0"
description = "Identity-Exposure & Breach-Notification Compliance Screener — detects/validates leaked SSNs and per-state US drivers'-license numbers in breach dumps, classifies identity-theft severity, and emits 50-state notification-compliance triage. Zero external dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Forge (Jarmes system)" }]

[project.scripts]
idguard = "idguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/idguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]