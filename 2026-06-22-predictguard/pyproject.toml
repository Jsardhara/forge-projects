[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "predictguard"
version = "0.1.0"
description = "Compliance monitoring and audit platform for prediction markets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
predictguard = "predictguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/predictguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
