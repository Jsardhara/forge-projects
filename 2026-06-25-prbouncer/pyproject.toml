[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prbouncer"
version = "0.1.0"
description = "PR spam detection engine — multi-signal heuristic scoring for open source maintainers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Forge"}]
keywords = ["github", "pull-request", "spam", "detection", "triage", "open-source"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
prbouncer = "prbouncer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prbouncer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
