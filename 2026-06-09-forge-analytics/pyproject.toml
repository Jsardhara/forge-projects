[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-analytics"
version = "0.1.0"
description = "Build pipeline intelligence for the Jarmes multi-agent system"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
forge-analytics = "forge_analytics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["forge_analytics"]
