[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zerosentinel"
version = "0.1.0"
description = "GitHub 0-Day Vulnerability Detection & Patch Automation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Forge", email = "forge@jarmes.local"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
zerosentinel = "zerosentinel.cli:main"

[build.targets.wheel]
packages = ["src/zerosentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
