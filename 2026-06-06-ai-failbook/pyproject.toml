[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-failbook"
version = "0.1.0"
description = "Structured AI failure mode database — catalog, search, and learn from AI fuckups"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
failbook = "ai_failbook.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
